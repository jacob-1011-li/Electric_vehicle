version: 2

models:
  - name: int_ev_select
    description: >
      Selects BEV and PHEV vehicles from the New Zealand vehicle register.
      The grain is one row per electric vehicle.

    columns:
      - name: vehicle_id
        description: "Unique identifier of the vehicle."
        data_tests:
          - not_null
          - unique

      - name: tla_name
        description: "Territorial Local Authority of the vehicle."

      - name: first_registration_month_date
        description: "First registration month of the vehicle."
        data_tests:
          - not_null

      - name: motive_power
        description: "Original motive-power value."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - ELECTRIC
                  - PLUGIN PETROL HYBRID

      - name: ev_type
        description: "Standardized electric vehicle category."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - BEV
                  - PHEV

      - name: vehicle_make
        description: "Vehicle manufacturer."

      - name: vehicle_model
        description: "Vehicle model."

      - name: vehicle_type
        description: "Type or classification of the vehicle."

      - name: vehicle_usage
        description: "Recorded usage of the vehicle."